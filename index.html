<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG here, so this must be a real PNG or the home-screen
         icon falls back to a screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Every claim below is checked against what the code actually does.
      Removed from the previous version, all of it invented:
        - "100+ منصة"      the extractor supports 6 platforms
        - "جودة 8K"         YouTube tops out at 4K here, and 8K sources are rare
        - "15 مليون تحميل"  there is no counter, and never was
        - "معدل نجاح 99.8%" no success metric is recorded anywhere
        - aggregateRating 4.9 from 15,420 ratings, plus a fabricated review
          attributed to a person who does not exist. Fake review markup is also a
          Google structured-data violation and risks a manual penalty.
      The domain is not registered yet, so there is no canonical or og:url. A
      canonical pointing at a domain you do not own hands your SEO to someone else.
    -->
    <title>حمّل الفيديو بدون إعلانات | يوتيوب وتيك توك وتويتر وريديت</title>
    <meta
      name="description"
      content="الصق رابط الفيديو واحصل على الملف مباشرة. يدعم يوتيوب وتيك توك وتويتر/إكس وريديت. بدون إعلانات ولا نوافذ منبثقة ولا تسجيل. دمج الجودات العالية يتم داخل متصفحك."
    />
    <meta
      name="keywords"
      content="تحميل فيديو, تنزيل يوتيوب, تحميل تيك توك بدون علامة مائية, تنزيل تويتر, تحميل ريديت, video downloader, بدون إعلانات"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="حمّل الفيديو بدون إعلانات" />
    <meta
      property="og:description"
      content="الصق الرابط، اختر الجودة، احفظ الملف. يوتيوب وتيك توك وتويتر/إكس وريديت. بدون إعلانات ولا تسجيل."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="حمّل الفيديو بدون إعلانات" />
    <meta
      name="twitter:description"
      content="الصق الرابط، اختر الجودة، احفظ الملف. بدون إعلانات ولا تسجيل."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="/manifest.json" />

    <!--
      One WebApplication block. The previous file shipped three overlapping blocks
      (WebApplication, SoftwareApplication, WebSite) describing the same thing,
      which competes with itself for the same rich result. featureList states only
      shipped behaviour.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "محمّل الفيديو",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any modern browser",
        "inLanguage": "ar",
        "isAccessibleForFree": true,
        "featureList": [
          "تحميل من يوتيوب وتيك توك وفيميو وتويتر/إكس وريديت وديلي موشن",
          "تيك توك بدون علامة مائية",
          "دمج الصوت والصورة داخل المتصفح للجودات العالية",
          "استخراج المقطع الصوتي وحده",
          "بدون إعلانات ولا تتبّع ولا تسجيل"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <style>
      /* Inline so first paint is themed correctly before the CSS bundle lands.
         Without this the shell flashes white on a dark-mode device. */
      :root {
        --boot-surface: #fcfcfd;
        --boot-line: #e4e4e7;
        --boot-accent: #1d4ed8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-surface: #17171a;
          --boot-line: #2e2e34;
          --boot-accent: #76a3ff;
        }
      }
      html {
        background: var(--boot-surface);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1rem;
        background: var(--boot-surface);
      }
      #boot i {
        display: block;
        width: 28px;
        height: 28px;
        border: 2px solid var(--boot-line);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot" aria-hidden="true"><i></i></div>

    <div id="root"></div>

    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.7">
        <h1 style="font-size: 1.5rem">هذه الأداة تحتاج JavaScript</h1>
        <p>
          استخراج روابط الفيديو ودمج الصوت مع الصورة يحدثان داخل متصفحك، وكلاهما
          يحتاج JavaScript. فعّله ثم أعد تحميل الصفحة.
        </p>
      </div>
    </noscript>

    <script>
      // The old file removed the loader on a fixed 1200ms timer, so the spinner
      // sat on top of a rendered page (or vanished before React mounted). React
      // now removes it in main.jsx once the tree is actually on screen.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            /* Offline shell is an enhancement. Failing it changes nothing. */
          });
        });
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
