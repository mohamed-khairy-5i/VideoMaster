# Netlify configuration, tuned for the free tier.
#
# Architecture note: video bytes never touch a serverless function. Extraction is
# a small JSON function; the actual file transfer runs through an edge function
# that streams bytes without buffering. That is what keeps this inside the free
# plan while still serving large files.

[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Edge function: streaming download proxy (declared in-file via `config.path`,
# repeated here so the routing is explicit and reviewable).
[[edge_functions]]
  path = "/api/stream"
  function = "stream"

# SPA fallback. Must stay last so it never shadows the API routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # 'wasm-unsafe-eval' is required by ffmpeg.wasm (client-side muxing).
    # blob:/data: in media-src are required to play locally-muxed output.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: https:; media-src 'self' blob: data: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
